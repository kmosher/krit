[package]
name = "krit-desktop"
version = "0.1.0"
description = "Desktop shell for krit — one window per review"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# The app lives inside the cargo workspace's directory tree but is not a member
# of it — it ships on its own cadence and pulls in the whole Tauri dependency
# graph, which has no business in `cargo build` for the CLI. Cargo does not
# infer that: without this empty table it refuses every command run from here
# ("current package believes it's in a workspace when it's not"), including the
# `cargo metadata` that `cargo tauri build` runs first, so the app could not be
# built at all by the command its README documents.
[workspace]
