[package]
name = "krit"
description = "Local code review between you and your agent: diffs, margin comments, live events."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
krit-core.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "sync", "time", "net"] }
serde.workspace = true
serde_json.workspace = true
notify = "8"
notify-debouncer-full = "0.5"
rust-embed = "8"
async-stream = "0.3"
futures-core = "0.3"
uuid = { version = "1", features = ["v4"] }
open = "5"
ureq.workspace = true
